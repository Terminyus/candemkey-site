<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.ico">
</head>
<body>
<title>Candemkey Web Sitesi</title>
<style>
  /* Tek görünüm: Candemkey sitesiyle aynı koyu marka zemini (yalnızca koyu tema). */
  :root {
    --bg: #070B1A;
    --surface: #0F1629;
    --border: #26304D;
    --fg: #F5F7FF;
    --muted: #A3ACC7;
    --accent: #8B5CF6;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  html, body { background: var(--bg); color: var(--fg); }
  body { font-family: var(--font); padding-inline: 16px; padding-block: 0; }
  main {
    min-height: 100vh; min-height: 100dvh;
    display: grid; place-content: center; gap: 28px;
    max-width: 520px; margin-inline: auto; text-align: left;
  }
  .wordmark { width: min(420px, 100%); height: auto; display: block; }
  p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 12px; }
  a {
    display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding-inline: 18px;
    border: 1px solid var(--border); border-radius: 999px; background: var(--surface);
    color: var(--fg); text-decoration: none; font-size: 15px; font-weight: 600;
  }
  a:hover { border-color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  a span { color: var(--muted); font-weight: 500; font-size: 13px; letter-spacing: .06em; }
</style>
<main>
  <img class="wordmark" src="assets/img/candemkey-wordmark-1080w.b0cc16c481.png" width="1080" height="360" alt="Candemkey by Candemsoft">
  <p>Dil seç · Choose a language · Elige un idioma</p>
  <ul>
    <li><a href="tr/index.html" hreflang="tr" lang="tr" data-lang="tr"><span>TR</span>Türkçe</a></li>
    <li><a href="en/index.html" hreflang="en" lang="en" data-lang="en"><span>EN</span>English</a></li>
    <li><a href="es/index.html" hreflang="es" lang="es" data-lang="es"><span>ES</span>Español</a></li>
  </ul>
</main>
<script>
  (function () {
    var langs = ["tr", "en", "es"], pick = null;
    try { pick = localStorage.getItem("ck-lang"); } catch (e) {}
    if (langs.indexOf(pick) < 0) {
      pick = null;
      var prefs = navigator.languages || [navigator.language || ""];
      for (var i = 0; i < prefs.length && !pick; i++) {
        var code = String(prefs[i]).slice(0, 2).toLowerCase();
        if (langs.indexOf(code) >= 0) pick = code;
      }
    }
    document.querySelectorAll("a[data-lang]").forEach(function (a) {
      a.addEventListener("click", function () { try { localStorage.setItem("ck-lang", a.dataset.lang); } catch (e) {} });
    });
    location.replace((pick || "tr") + "/index.html");
  })();
</script>

</body>
</html>
